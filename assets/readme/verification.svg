<svg xmlns="http://www.w3.org/2000/svg" width="960" height="574" viewBox="0 0 960 574" role="img"><title>How we test axon: five levels</title><rect x="0.5" y="0.5" width="959" height="573" rx="4" fill="#0a0b0c" stroke="#24282c"/><g transform="translate(0 -30)"><line x1="40" y1="138" x2="920" y2="138" stroke="#24282c"/><text x="40" y="86" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#eceded" text-anchor="start" letter-spacing="-0.3">How we test axon</text><text x="40" y="112" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8a8e94" text-anchor="start" >Five levels of tests, from the design to real servers. Each level finds errors that the level above it cannot find.</text><text x="40" y="174" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#e0b252" text-anchor="start" >Models · TLA+</text><text x="40" y="198" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#eceded" text-anchor="start" >TLC examines all the states that it can reach</text><line x1="466" y1="160" x2="466" y2="208" stroke="#24282c"/><text x="480" y="182" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="500" fill="#e0b252" text-anchor="start" letter-spacing="-0.6">7</text><text x="480" y="200" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >models: leases, hand-over,</text><text x="480" y="214" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >relays, disk, quotas, seeds</text><line x1="614" y1="160" x2="614" y2="208" stroke="#24282c"/><text x="628" y="182" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="500" fill="#e0b252" text-anchor="start" letter-spacing="-0.6">3.6 B</text><text x="628" y="200" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >states examined,</text><text x="628" y="214" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >and TLC found no error</text><line x1="762" y1="160" x2="762" y2="208" stroke="#24282c"/><text x="776" y="182" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="500" fill="#e0b252" text-anchor="start" letter-spacing="-0.6">109</text><text x="776" y="200" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >mutations add an error;</text><text x="776" y="214" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >TLC found all of them</text><line x1="40" y1="228" x2="920" y2="228" stroke="#24282c"/><text x="40" y="262" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#e0b252" text-anchor="start" >Concurrency · loom</text><text x="40" y="286" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#eceded" text-anchor="start" >loom examines each thread order on lock-free paths</text><line x1="466" y1="248" x2="466" y2="296" stroke="#24282c"/><text x="480" y="270" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="500" fill="#e0b252" text-anchor="start" letter-spacing="-0.6">16</text><text x="480" y="288" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >loom models, which run</text><text x="480" y="302" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >each time check.sh runs</text><line x1="614" y1="248" x2="614" y2="296" stroke="#24282c"/><text x="628" y="270" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="500" fill="#e0b252" text-anchor="start" letter-spacing="-0.6">4</text><text x="628" y="288" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >paths: the mailbox, worker wake,</text><text x="628" y="302" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >remote replies, write order</text><line x1="40" y1="316" x2="920" y2="316" stroke="#24282c"/><text x="40" y="350" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#e0b252" text-anchor="start" >Deterministic simulation · the World</text><text x="40" y="374" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#eceded" text-anchor="start" >Real clusters run on virtual time. A seed sets the faults.</text><line x1="466" y1="336" x2="466" y2="384" stroke="#24282c"/><text x="480" y="358" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="500" fill="#e0b252" text-anchor="start" letter-spacing="-0.6">87</text><text x="480" y="376" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >World tests: crash, skew,</text><text x="480" y="390" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >pause, partition, full disk</text><line x1="614" y1="336" x2="614" y2="384" stroke="#24282c"/><text x="628" y="358" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="500" fill="#e0b252" text-anchor="start" letter-spacing="-0.6">64</text><text x="628" y="376" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >seeds per test per check;</text><text x="628" y="390" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >two runs give one digest</text><line x1="762" y1="336" x2="762" y2="384" stroke="#24282c"/><text x="776" y="358" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="500" fill="#e0b252" text-anchor="start" letter-spacing="-0.6">60 000</text><text x="776" y="376" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >seeds per test, which</text><text x="776" y="390" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >ran on dev boxes</text><line x1="40" y1="404" x2="920" y2="404" stroke="#24282c"/><text x="40" y="438" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#e0b252" text-anchor="start" >Real faults · the rig</text><text x="40" y="462" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#eceded" text-anchor="start" >Five servers get real faults. A checker reads the logs.</text><line x1="466" y1="424" x2="466" y2="472" stroke="#24282c"/><text x="480" y="446" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="500" fill="#e0b252" text-anchor="start" letter-spacing="-0.6">68</text><text x="480" y="464" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >fault classes: kill -9, OOM,</text><text x="480" y="478" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >partitions, disk, clock steps</text><line x1="614" y1="424" x2="614" y2="472" stroke="#24282c"/><text x="628" y="446" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="500" fill="#e0b252" text-anchor="start" letter-spacing="-0.6">79</text><text x="628" y="464" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >invariants; the checker</text><text x="628" y="478" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >examines them in the logs</text><line x1="762" y1="424" x2="762" y2="472" stroke="#24282c"/><text x="776" y="446" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="500" fill="#e0b252" text-anchor="start" letter-spacing="-0.6">602</text><text x="776" y="464" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >fault episodes in one</text><text x="776" y="478" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >night of 6.9 hours</text><line x1="40" y1="492" x2="920" y2="492" stroke="#24282c"/><text x="40" y="526" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#e0b252" text-anchor="start" >Fault matrix · fuzz tests</text><text x="40" y="550" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#eceded" text-anchor="start" >Tests apply each fault to each feature that it can reach</text><line x1="466" y1="512" x2="466" y2="560" stroke="#24282c"/><text x="480" y="534" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="500" fill="#e0b252" text-anchor="start" letter-spacing="-0.6">4</text><text x="480" y="552" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >gaps in 45 features</text><text x="480" y="566" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >× 18 kinds of fault</text><line x1="614" y1="512" x2="614" y2="560" stroke="#24282c"/><text x="628" y="534" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="500" fill="#e0b252" text-anchor="start" letter-spacing="-0.6">922</text><text x="628" y="552" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >tests in the matrix; each</text><text x="628" y="566" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >applies its fault</text><line x1="762" y1="512" x2="762" y2="560" stroke="#24282c"/><text x="776" y="534" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="500" fill="#e0b252" text-anchor="start" letter-spacing="-0.6">4</text><text x="776" y="552" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >fuzz targets: the decoders</text><text x="776" y="566" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8e94" text-anchor="start" >and the stream core</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img"><title>TLA+: TLC examined 3.6 billion states and found all 109 mutations</title><rect x="0.5" y="0.5" width="959" height="549" rx="4" fill="#0a0b0c" stroke="#24282c"/><g transform="translate(0 -30)"><line x1="40" y1="138" x2="920" y2="138" stroke="#24282c"/><text x="40" y="86" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#eceded" text-anchor="start" letter-spacing="-0.3">TLC examined 3.6 billion states and found no error</text><text x="40" y="112" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8a8e94" text-anchor="start" >The largest run of each model. A mutation adds an error. If TLC does not find it, the check fails.</text><defs><linearGradient id="open" x1="0" x2="1"><stop offset="0.7" stop-color="#e0b252"/><stop offset="1" stop-color="#e0b252" stop-opacity="0.1"/></linearGradient></defs><line x1="380.0" y1="170" x2="380.0" y2="498" stroke="#24282c" stroke-dasharray="2 3"/><text x="380.0" y="162" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#5b5f65" text-anchor="middle" >1 M</text><line x1="479.9687977490258" y1="170" x2="479.9687977490258" y2="498" stroke="#24282c" stroke-dasharray="2 3"/><text x="479.9687977490258" y="162" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#5b5f65" text-anchor="middle" >10 M</text><line x1="579.9375954980516" y1="170" x2="579.9375954980516" y2="498" stroke="#24282c" stroke-dasharray="2 3"/><text x="579.9375954980516" y="162" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#5b5f65" text-anchor="middle" >100 M</text><line x1="679.9063932470774" y1="170" x2="679.9063932470774" y2="498" stroke="
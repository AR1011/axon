[package]
name = "axon-net"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
readme = "../axon/README.md"
description = "Authenticated, bounded, ordered, framed sessions over TCP/TLS"

[features]
serde = ["dep:serde", "axon/serde"]

[dependencies]
axon = { path = "../axon", default-features = false }
bytes = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
ring = "0.17"
serde = { version = "1", features = ["derive"], optional = true }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
zstd = { version = "0.13", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(axon_loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
rcgen = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }

[lints]
workspace = true

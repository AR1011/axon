[package]
name = "axon-cluster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
# Its tests need axon-testkit by path, which crates.io strips, so they cannot build from the package.
exclude = ["tests/"]
description = "Clustering for axon: discovery, membership, remote calls, remote spawn, unique-by-key placement"
keywords = ["actor", "cluster", "distributed", "lease", "axon"]
categories = ["concurrency", "network-programming"]

[package.metadata.docs.rs]
all-features = true

[features]
consul = ["dep:reqwest", "dep:serde_json"]
serde = ["dep:serde", "axon/serde", "axon-net/serde"]

[dependencies]
axon = { workspace = true, features = ["system"] }
axon-net = { workspace = true }
bytes = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"], optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(axon_loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
axon = { workspace = true, features = ["tracing"] }
axon-testkit = { path = "../axon-testkit" }
rcgen = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "test-util", "io-util"] }
tracing = { workspace = true }

[lints]
workspace = true

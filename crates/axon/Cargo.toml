[package]
name = "axon-actors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed actors on a thread-per-worker runtime, with supervision, routers, topics, timers and a durable log"
keywords = ["actor", "actors", "concurrency", "async", "distributed"]
categories = ["concurrency", "asynchronous"]

[lib]
name = "axon"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["system"]
system = ["dep:tokio"]
serde = ["dep:serde"]
tracing = ["dep:tracing"]

[dependencies]
bytes = "1"
core_affinity = "0.8"
futures-core = "0.3"
futures-sink = "0.3"
parking_lot = "0.12"
serde = { version = "1", features = ["derive", "rc"], optional = true }
tokio = { version = "1", features = ["rt", "sync", "time"], optional = true }
tracing = { workspace = true, optional = true }

[target.'cfg(axon_loom)'.dependencies]
loom = { version = "0.7", features = ["futures"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

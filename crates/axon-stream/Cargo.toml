[package]
name = "axon-stream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
# Its tests need axon-testkit by path, which crates.io strips, so they cannot build from the package.
exclude = ["tests/"]
description = "Sequenced streams for axon: fanout hub, replay-to-live recovery, and clustered relays with failover"
keywords = ["stream", "pubsub", "replication", "distributed", "axon"]
categories = ["concurrency", "network-programming"]

[package.metadata.docs.rs]
all-features = true

[features]
cluster = ["axon/system", "dep:axon-cluster", "dep:axon-net", "dep:parking_lot", "dep:tokio"]
serde = ["dep:serde", "axon/serde"]

[dependencies]
axon = { workspace = true }
axon-cluster = { workspace = true, optional = true }
axon-net = { workspace = true, optional = true }
bytes = "1"
parking_lot = { version = "0.12", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"], optional = true }

[dev-dependencies]
axon = { workspace = true, features = ["system"] }
axon-testkit = { path = "../axon-testkit" }
tokio = { version = "1", features = ["rt-multi-thread", "test-util", "net", "io-util"] }

[[example]]
name = "disk"
required-features = ["cluster"]

[[example]]
name = "relay_wan"
required-features = ["cluster"]

[[test]]
name = "gateway"
required-features = ["cluster"]

[[test]]
name = "relay"
required-features = ["cluster"]

[[test]]
name = "world"
required-features = ["cluster"]

[[test]]
name = "world_disk"
required-features = ["cluster"]

[[test]]
name = "world_relay"
required-features = ["cluster"]

[[test]]
name = "world_lanes"
required-features = ["cluster"]

[[test]]
name = "world_limits"
required-features = ["cluster"]

[[test]]
name = "world_upgrade"
required-features = ["cluster"]

[[test]]
name = "world_wan"
required-features = ["cluster"]

[lints]
workspace = true

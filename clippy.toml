allow-unwrap-in-tests = true
disallowed-methods = [
  { path = "tokio::sync::mpsc::unbounded_channel", reason = "every queue is bounded: size it and handle Full (crates/axon/README.md rule 11)" },
  { path = "std::sync::mpsc::channel", reason = "every queue is bounded: use sync_channel or a tokio bounded channel" },
  { path = "std::time::Instant::now", reason = "real time escapes a simulation: use tokio::time::Instant or the actor Clock (spec/simulation.md)" },
  { path = "std::time::Instant::elapsed", reason = "real time escapes a simulation: use tokio::time::Instant or the actor Clock (spec/simulation.md)" },
  { path = "std::time::SystemTime::now", reason = "the wall clock is axon::trace::unix_micros, which a simulation sets per node" },
  { path = "std::time::SystemTime::elapsed", reason = "the wall clock is axon::trace::unix_micros, which a simulation sets per node" },
  { path = "std::hash::RandomState::new", reason = "process entropy escapes a simulation's seed" },
  { path = "std::thread::spawn", reason = "a thread runs outside a simulation's virtual time" },
  { path = "std::thread::Builder::spawn", reason = "a thread runs outside a simulation's virtual time" },
  { path = "std::thread::Builder::spawn_scoped", reason = "a thread runs outside a simulation's virtual time" },
  { path = "std::thread::Scope::spawn", reason = "a thread runs outside a simulation's virtual time" },
  { path = "tokio::task::spawn_blocking", reason = "a blocking pool thread runs outside a simulation's virtual time" },
  { path = "tokio::runtime::Handle::spawn_blocking", reason = "a blocking pool thread runs outside a simulation's virtual time" },
  { path = "std::collections::HashMap::iter", reason = "hash order differs per process: a BTreeMap, a sort, or #[expect] where order cannot matter" },
  { path = "std::collections::HashMap::iter_mut", reason = "hash order differs per process: a BTreeMap, a sort, or #[expect] where order cannot matter" },
  { path = "std::collections::HashMap::keys", reason = "hash order differs per process: a BTreeMap, a sort, or #[expect] where order cannot matter" },
  { path = "std::collections::HashMap::values", reason = "hash order differs per process: a BTreeMap, a sort, or #[expect] where order cannot matter" },
  { path = "std::collections::HashMap::values_mut", reason = "hash order differs per process: a BTreeMap, a sort, or #[expect] where order cannot matter" },
  { path = "std::collections::HashMap::drain", reason = "hash order differs per process: a BTreeMap, a sort, or #[expect] where order cannot matter" },
  { path = "std::collections::HashMap::retain", reason = "hash order differs per process: a BTreeMap, a sort, or #[expect] where order cannot matter" },
  { path = "std::collections::HashMap::extract_if", reason = "hash order differs per process: a BTreeMap, a sort, or #[expect] where order cannot matter" },
  { path = "std::collections::HashMap::into_keys", reason = "hash order differs per process: a BTreeMap, a sort, or #[expect] where order cannot matter" },
  { path = "std::collections::HashMap::into_values", reason = "hash order differs per process: a BTreeMap, a sort, or #[expect] where order cannot matter" },
  { path = "std::collections::HashSet::iter", reason = "hash order differs per process: a BTreeMap, a sort, or #[expect] where order cannot matter" },
  { path = "std::collections::HashSet::drain", reason = "hash order differs per process: a BTreeMap, a sort, or #[expect] where order cannot matter" },
  { path = "std::collections::HashSet::retain", reason = "hash order differs per process: a BTreeMap, a sort, or #[expect] where order cannot matter" },
  { path = "std::collections::HashSet::extract_if", reason = "hash order differs per process: a BTreeMap, a sort, or #[expect] where order cannot matter" },
]

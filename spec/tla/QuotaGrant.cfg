\* The protocol as built, under message faults: one report or answer lost or late (then in any
\* order), and a late message arriving twice. Hold = Lease: a node believes a grant exactly as long
\* as the replica counts it (§2.4 has lease_hold < lease_wait), the tightest case. The other passing
\* configs: QuotaGrantFaults (the majority rule), QuotaGrantReports, QuotaGrantRestart, QuotaGrantPull,
\* QuotaGrantPush.
CONSTANTS
    N = 2
    Replicas = {r1, r2, r3}
    M = 2
    Costs = {1}
    Hold = 1
    Lease = 1
    MaxTime = 1
    MaxTakes = 3
    MaxReports = 2
    MaxRestarts = 0
    MaxDups = 1
    MaxPushes = 1
    MaxFaults = 1
    MaxLeft = 0
    Late = "any"
    Taken = TRUE
    PulledRaise = TRUE
    Bug = "none"
SPECIFICATION Spec
SYMMETRY Symmetry
VIEW View
INVARIANTS WithinLimit FallbackBound MaxMinFair
CHECK_DEADLOCK FALSE

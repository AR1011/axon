\* The protocol as built, with three answers or pushes that leave the entry out, where other keys
\* fill them: a report acknowledges an answer that did not carry it, and the hold must stay; a node
\* silent for a lease takes in an answer that leaves out the entry its replica freed.
CONSTANTS
    N = 2
    Replicas = {r1, r2, r3}
    M = 2
    Costs = {1}
    Hold = 1
    Lease = 1
    MaxTime = 1
    MaxTakes = 3
    MaxReports = 2
    MaxRestarts = 0
    MaxDups = 0
    MaxPushes = 3
    MaxFaults = 0
    MaxLeft = 3
    Late = "any"
    Taken = FALSE
    PulledRaise = TRUE
    Bug = "none"
SPECIFICATION Spec
SYMMETRY Symmetry
VIEW View
INVARIANTS WithinLimit FallbackBound MaxMinFair
CHECK_DEADLOCK FALSE

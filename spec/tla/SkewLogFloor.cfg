\* The bounds of mutations/SkewBeyondWait.cfg, clocks further apart than the restart wait, with the log's floor:
\* epochs still grow, so this must pass. mutations/FloorAfterAnswer.cfg must fail.
CONSTANTS
    Acceptors = {a1, a2, a3}
    Proposers = {1, 2}
    AcceptorLease = 1
    HolderLease = 1
    RestartWait = 1
    MaxSkew = 2
    MaxTime = 1
    MaxPrepares = 1
    MaxCrashes = 1
    HolderFromReply = FALSE
    EpochTies = FALSE
    FloorAtCrash = FALSE
    Durable = TRUE
    AnswerBeforeDisk = FALSE
    LogFloor = TRUE
SPECIFICATION Spec
SYMMETRY Symmetry
VIEW View
INVARIANTS MutualExclusion EpochsGrow
CHECK_DEADLOCK FALSE

\* Witnesses, in place of -coverage (which runs out of heap on this spec): run with -continue; TLC
\* must report every one of these invariants violated, so the bounds reach a fallback admission,
\* one fresh grant, a hold's older generation, a late message across a tick, a pulled hold, a grant
\* of a replaced incarnation still counted, and a silent node's hold.
CONSTANTS
    N = 2
    Replicas = {r1, r2, r3}
    M = 2
    Costs = {1}
    Hold = 1
    Lease = 1
    MaxTime = 1
    MaxTakes = 1
    MaxReports = 2
    MaxRestarts = 1
    MaxDups = 0
    MaxPushes = 1
    MaxFaults = 2
    MaxLeft = 0
    Late = "reports"
    Taken = TRUE
    PulledRaise = TRUE
    Bug = "none"
SPECIFICATION Spec
SYMMETRY Symmetry
VIEW View
INVARIANTS WFallback WOneFresh WShift WLate WPulled WOldIncarnation WSilentHeld
CHECK_DEADLOCK FALSE

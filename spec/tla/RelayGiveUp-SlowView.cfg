\* Not a gap of the code: a view that shows a node only upstream_timeout after its link is up (ViewLag = UT). NoNeedlessReset fails: the wait holds only while membership follows a heal within upstream_timeout.
CONSTANTS
    Relays = {"r1"}
    K = 2
    MaxSeq = 3
    MaxGen = 2
    UT = 2
    ViewLag = 2
    MaxBackoff = 3
    MaxCuts = 2
    MaxCrashes = 1
    Mutation = "none"
    Gaps = {}
SPECIFICATION Spec
INVARIANTS TypeOK NoSilentGap NoNeedlessReset NewGenFromOne GenNeverBack NoStartSkipped GenAheadNeverRefused
PROPERTY Recovers
CHECK_DEADLOCK FALSE

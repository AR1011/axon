\* Safety with grace longer than a renewal's answer (Grace = 3, Hold and AccLease = 4, renewals and
\* acquires answered within 2), 3 grants, a start on a stale view, no crash or leave, the code's gaps
\* closed. At Handover.cfg's Grace = 2 no renewal is both answered late enough to matter and early enough
\* to extend, so a fence counted from the reply instead of the send passes there;
\* mutations/Handover-FenceFromReply.cfg must fail here.
CONSTANTS
    N = 2
    Grace = 3
    Hold = 4
    AccLease = 4
    MaxDelay = 2
    AcqDelay = 2
    MaxE = 3
    MaxCrashes = 0
    MaxLeaves = 0
    MaxAuthFaults = 0
    MaxStray = 1
    MaxLate = 0
    Punctual = FALSE
    Callers = TRUE
    Eager = FALSE
    OtherKeys = FALSE
    Open = {}
    MaxCuts = 0
    Bug = "none"
SPECIFICATION Spec
VIEW View
INVARIANTS OneUnfenced MoveInOrder WritesInOrder WatchInOrder WatchShowsLive
CHECK_DEADLOCK FALSE

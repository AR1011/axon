\* The store as it is. DiskResume-MetaReorder.cfg beside it fails: an assumption about the file
\* system. Every mutations/DiskResume-*.cfg must fail.
\* WritesGoThrough is checked by DiskResume-Live.cfg: with it, TLC checks each fairness condition on
\* every step, too slow at these bounds.
CONSTANTS
    MaxPub = 5
    SegFrames = 2
    MaxCrashes = 2
    MaxFails = 2
    Gaps = {}
    Bug = "none"
SPECIFICATION Spec
INVARIANTS NoRewrite ResumeAfterSeen NextAfterDurable CursorDurable SeenDurable DurableKept RingContiguous
CHECK_DEADLOCK FALSE

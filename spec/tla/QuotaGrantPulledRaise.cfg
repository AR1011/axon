\* The protocol as built, with a replica restart and two reports lost: FAILS, WithinLimit
\* violated (a possible bug in core.rs, not fixed here; spec/quotas.md §7). Node 1's report to r1 and
\* node 2's to r2 are lost, so r1 grants node 2 all of M and r2 grants node 1 all of M; r3 heard
\* both, granted node 1 all of M, then lowered it (not yet acknowledged) and gave node 2 0. r3
\* restarts and pulls holds of M for both rows from r1 and r2, over the limit, so regrant raises
\* from the pulled hold (base = row.held() when !fits) and grants each 1. Node 2's view shows the
\* restart and admits on min(r1, new r3) = 1; node 1's lags and admits on min(r2, old r3) = 2: 3 > M,
\* no fallback permits. Each node took a permit and gave it back first (Taken), so every report
\* carries a real entry.
CONSTANTS
    N = 2
    Replicas = {r1, r2, r3}
    M = 2
    Costs = {1}
    Hold = 1
    Lease = 1
    MaxTime = 0
    MaxTakes = 0
    MaxReports = 2
    MaxRestarts = 1
    MaxDups = 0
    MaxPushes = 0
    MaxFaults = 2
    MaxLeft = 0
    Late = "lost"
    Taken = TRUE
    PulledRaise = TRUE
    Bug = "none"
SPECIFICATION Spec
SYMMETRY Symmetry
VIEW View
INVARIANTS WithinLimit FallbackBound MaxMinFair
CHECK_DEADLOCK FALSE

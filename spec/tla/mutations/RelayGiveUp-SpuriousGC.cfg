\* Past bug, before 5f19599: a relay still on the generation before the leaf's answers GenerationMismatch, and the leaf resets as if the relay were ahead, while the origin holds the leaf's position (open_branch, interest_result). The relay missed the restart because it was cut from the origin (RelaysCutAtRestart); the leaf asks it after the heal, before it hears of the restart. NoNeedlessReset must fail.
CONSTANTS
    Relays = {"r1"}
    K = 2
    MaxSeq = 3
    MaxGen = 2
    UT = 2
    ViewLag = 1
    MaxBackoff = 3
    MaxCuts = 3
    MaxCrashes = 1
    Mutation = "SpuriousGC"
    Gaps = {}
SPECIFICATION Spec
ACTION_CONSTRAINT RelaysCutAtRestart
INVARIANTS TypeOK NoSilentGap NoNeedlessReset NewGenFromOne GenNeverBack NoStartSkipped GenAheadNeverRefused
PROPERTY Recovers
CHECK_DEADLOCK FALSE

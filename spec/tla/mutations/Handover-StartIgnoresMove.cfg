\* Before f8acecd: a start that waited out an old lease while the key's owner rejoined landed without
\* looking at the view again, after the pass that would move the key back had run: the key stays off its
\* owner, whose callers are refused Held. KeyServed must fail.
CONSTANTS
    N = 2
    Grace = 3
    Hold = 4
    AccLease = 4
    MaxDelay = 1
    AcqDelay = 0
    MaxE = 8
    MaxCrashes = 1
    MaxLeaves = 1
    MaxAuthFaults = 1
    MaxStray = 1
    MaxLate = 1
    Punctual = TRUE
    Callers = TRUE
    Eager = FALSE
    OtherKeys = FALSE
    Open = {}
    MaxCuts = 0
    Bug = "StartIgnoresMove"
SPECIFICATION LiveSpec
INVARIANTS OneUnfenced
PROPERTY KeyServed
CHECK_DEADLOCK FALSE

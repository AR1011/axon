    N = 2
    Grace = 2
    Hold = 3
    AccLease = 3
    MaxDelay = 2
    AcqDelay = 2
    MaxE = 3
    MaxCrashes = 1
    MaxLeaves = 1
    MaxAuthFaults = 0
    MaxStray = 1
    MaxLate = 0
    Punctual = FALSE
    Callers = TRUE
    Eager = FALSE
    OtherKeys = FALSE
    Open = {}
    MaxCuts = 0
    Bug = "ReleaseBeforeStop"
SPECIFICATION Spec
VIEW View
INVARIANTS MoveInOrder
CHECK_DEADLOCK FALSE

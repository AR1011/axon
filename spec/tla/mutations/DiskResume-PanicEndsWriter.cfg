\* A store that panics ends the writer task, as before 18d182f ("A store whose write panics fails
\* that write, which is taken again; the writer goes on"): nothing is written again until the
\* process restarts. WritesGoThrough must fail.
CONSTANTS
    MaxPub = 4
    SegFrames = 2
    MaxCrashes = 2
    MaxFails = 1
    Gaps = {}
    Bug = "PanicEndsWriter"
SPECIFICATION LiveSpec
PROPERTY WritesGoThrough
CHECK_DEADLOCK FALSE

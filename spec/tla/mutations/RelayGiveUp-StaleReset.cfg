    Relays = {"r1"}
    K = 2
    MaxSeq = 3
    MaxGen = 2
    UT = 2
    ViewLag = 1
    MaxBackoff = 3
    MaxCuts = 2
    MaxCrashes = 1
    Mutation = "StaleReset"
    Gaps = {}
SPECIFICATION Spec
ACTION_CONSTRAINT KeepUp
INVARIANTS TypeOK NoSilentGap NoNeedlessReset NewGenFromOne GenNeverBack NoStartSkipped GenAheadNeverRefused
PROPERTY Recovers
CHECK_DEADLOCK FALSE

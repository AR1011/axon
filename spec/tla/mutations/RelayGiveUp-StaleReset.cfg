\* Past bug, before 5e7ae55: a relay that fell behind reset every branch with HistoryUnavailable, one ahead of what it lost too, took the key up again at the leaf's position, and the leaf, its only candidate, gave up on the reset. KeepUp: the relay falls behind the origin's ring only while cut from it. NoNeedlessReset must fail.

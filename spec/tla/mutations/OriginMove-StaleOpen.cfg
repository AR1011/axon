\* The new writer opens after a copy that lags the commit, and writes over its last record.
\* SameRecord must fail.
CONSTANTS
    MaxSeq = 3
    MaxMoves = 2
    MaxFaults = 2
    Mutation = "StaleOpen"
SPECIFICATION Spec
INVARIANTS TypeOK NoRepeat NoGap SameRecord NoEnd
PROPERTY CatchesUp
CHECK_DEADLOCK FALSE

\* A write whose sync_data passed reaches the hub though the directory's sync failed, and OsFiles
\* cuts its files back (disk.rs, OsFiles::apply_now; core.rs, disk_written with Err). CursorDurable
\* must fail: what the hub serves is no longer on disk. NextAfterDurable is left out, as the flush
\* is kept for its retry.
CONSTANTS
    MaxPub = 4
    SegFrames = 2
    MaxCrashes = 2
    MaxFails = 1
    Gaps = {}
    Bug = "WrittenOnErr"
SPECIFICATION Spec
INVARIANTS NoRewrite ResumeAfterSeen CursorDurable SeenDurable DurableKept RingContiguous
CHECK_DEADLOCK FALSE

\* A failed write is dropped instead of taken again first (disk.rs: DiskStore::written keeps the
\* flush on an error). Its records keep their positions and never reach the hub. NextAfterDurable
\* must fail.
CONSTANTS
    MaxPub = 4
    SegFrames = 2
    MaxCrashes = 2
    MaxFails = 1
    Gaps = {}
    Bug = "DropFailedWrite"
SPECIFICATION Spec
INVARIANTS NoRewrite ResumeAfterSeen NextAfterDurable CursorDurable SeenDurable DurableKept RingContiguous
CHECK_DEADLOCK FALSE

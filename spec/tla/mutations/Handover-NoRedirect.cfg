\* A caller refused Held does not ask the holder: an owner cut from the holder, which keeps its lease and
\* in its own view owns the key, is asked for ever (world_reach.rs reach_holder). KeyServedReachable
\* must fail.
CONSTANTS
    N = 2
    Grace = 3
    Hold = 4
    AccLease = 4
    MaxDelay = 1
    AcqDelay = 0
    MaxE = 8
    MaxCrashes = 0
    MaxLeaves = 0
    MaxAuthFaults = 0
    MaxStray = 0
    MaxLate = 0
    Punctual = TRUE
    Callers = TRUE
    Eager = FALSE
    OtherKeys = FALSE
    Open = {}
    MaxCuts = 2
    Bug = "NoRedirect"
SPECIFICATION LiveSpec
INVARIANTS OneUnfenced MoveInOrder
PROPERTY KeyServedReachable
CHECK_DEADLOCK FALSE

\* After a close the relay forgets its position and asks First (core.rs repull today): where the new
\* origin's ring no longer holds record 1 it takes the live edge, past its followers. NoEnd must fail.
CONSTANTS
    MaxSeq = 3
    MaxMoves = 2
    MaxFaults = 2
    Mutation = "RepullForgets"
SPECIFICATION Spec
INVARIANTS TypeOK NoRepeat NoGap SameRecord NoEnd
PROPERTY CatchesUp
CHECK_DEADLOCK FALSE

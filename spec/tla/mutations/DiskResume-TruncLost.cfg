\* The store before 39577f5: OsFiles applied a Truncate as set_len and synced the file only when the
\* same write appended to it (disk.rs, OsFiles::apply_now). A boot truncates a torn tail behind two
\* copies of a frame a failed write left (a store that leaves appends, or the ignored set_len of a
\* cut-back that fails); the next write rolls to a new segment whose record is delivered; a machine
\* crash brings the torn tail back, and the boot after it cuts there and removes the new segment.
\* ResumeAfterSeen must fail. world_disk.rs a_tail_a_boot_cut_stays_cut_through_a_machine_crash.
CONSTANTS
    MaxPub = 5
    SegFrames = 2
    MaxCrashes = 2
    MaxFails = 2
    Gaps = {"TruncLost"}
    Bug = "none"
SPECIFICATION Spec
INVARIANTS NoRewrite ResumeAfterSeen
CHECK_DEADLOCK FALSE

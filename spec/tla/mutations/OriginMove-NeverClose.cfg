\* The old origin never closes: a relay that stays on it waits there while the new origin goes on.
\* CatchesUp must fail.
CONSTANTS
    MaxSeq = 3
    MaxMoves = 2
    MaxFaults = 2
    Mutation = "NeverClose"
SPECIFICATION Spec
INVARIANTS TypeOK NoRepeat NoGap SameRecord NoEnd
PROPERTY CatchesUp
CHECK_DEADLOCK FALSE

\* The floor taken at the crash, without the log's floor: a prepare sent before it wins after the wait. EpochsGrow
\* must fail. With LogFloor = TRUE it fails too, but at depth 23 after 12 M distinct states (5 min on 4 workers), not
\* in seconds: the log's floor does not stand in for the wait.
CONSTANTS
    Acceptors = {a1, a2, a3}
    Proposers = {1, 2}
    AcceptorLease = 2
    HolderLease = 2
    RestartWait = 2
    MaxSkew = 0
    MaxTime = 3
    MaxPrepares = 2
    MaxCrashes = 1
    HolderFromReply = FALSE
    EpochTies = FALSE
    FloorAtCrash = TRUE
    Durable = TRUE
    AnswerBeforeDisk = FALSE
    LogFloor = FALSE
SPECIFICATION Spec
SYMMETRY Symmetry
VIEW View
INVARIANTS EpochsGrow
CHECK_DEADLOCK FALSE

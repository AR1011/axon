\* The child keeps its channel state for the parent when an interest is answered out of sync: a late push of a boot it never followed retires the live boot for good, and every channel the live boot makes after it is answered Retired. FewChannels must fail.
CONSTANTS
    Streams = {"s1", "s2"}
    MaxRec = 2
    Window = 2
    MaxInflight = 2
    MaxBranch = 2
    MaxBoots = 2
    MaxChan = 5
    MaxFaults = 2
    Mutation = "NoForgetOnOutOfSync"
SPECIFICATION Spec
INVARIANTS FewChannels
CHECK_DEADLOCK FALSE

\* Before 3156261 (spec/paxos-leases.md 5.1): the renew loop counted a renewal from its reply, so a
\* slow answer let the actor run past the acceptors' lease. OneUnfenced must fail.
CONSTANTS
    N = 2
    Grace = 2
    Hold = 3
    AccLease = 3
    MaxDelay = 2
    AcqDelay = 2
    MaxE = 3
    MaxCrashes = 1
    MaxLeaves = 1
    MaxAuthFaults = 0
    MaxStray = 1
    MaxLate = 0
    Punctual = FALSE
    Callers = TRUE
    Eager = FALSE
    OtherKeys = FALSE
    Open = {}
    MaxCuts = 0
    Bug = "RenewFromReply"
SPECIFICATION Spec
VIEW View
INVARIANTS OneUnfenced
CHECK_DEADLOCK FALSE

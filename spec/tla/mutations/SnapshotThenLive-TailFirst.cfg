\* hub.rs drive_recovery inserts the replay at queue.len() instead of ahead of the held live batches
\* (queue.len() - tail): Contiguous must fail.
CONSTANTS
    Keys = {k1, k2}
    Vals = {v1}
    Absent = Absent
    MaxRecords = 4
    MaxCrashes = 2
    MaxResends = 1
    RingSize = 2
    ReplayOffset = 1
    SplitSnapshot = FALSE
    SnapAhead = FALSE
    ReadUnsynced = FALSE
    StaleResume = FALSE
    NoDedup = FALSE
    NoCoverCheck = FALSE
    StaleCut = FALSE
    TailFirst = TRUE
    StallRelay = FALSE
    EarlyRelease = FALSE
    RelaySubs = 1
    SnapToLive = FALSE
    KeepSubs = FALSE
    ReadPastCut = FALSE
    LabelAtRelease = FALSE
    StopAtReset = FALSE
SPECIFICATION Spec
SYMMETRY Symmetry
INVARIANTS Contiguous
CHECK_DEADLOCK FALSE

\* A past bug, before 234840d: watch_slot counted a lease as held until lose() took it out, so an old
\* owner whose renew loop had not run past the deadline showed an older epoch (keyed.rs
\* a_watch_shows_a_key_stopped_once_its_grace_is_spent_before_the_renew_loop_sees_it). WatchInOrder fails.
CONSTANTS
    N = 2
    Grace = 2
    Hold = 3
    AccLease = 3
    MaxDelay = 2
    AcqDelay = 2
    MaxE = 3
    MaxCrashes = 1
    MaxLeaves = 1
    MaxAuthFaults = 0
    MaxStray = 1
    MaxLate = 0
    Punctual = FALSE
    Callers = TRUE
    Eager = FALSE
    OtherKeys = FALSE
    Open = {"WatchTrustsDue"}
    MaxCuts = 0
    Bug = "none"
SPECIFICATION Spec
VIEW View
INVARIANTS WatchInOrder
CHECK_DEADLOCK FALSE

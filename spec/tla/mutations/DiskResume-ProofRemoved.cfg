\* The store before 294e305: a boot that finds the stream's first segment empty, or torn at its first
\* frame, queues its removal, though its name is all that proves the positions before it. The first
\* write after StreamNode::start removes it, whether the stream is opened or not; with no publish
\* written since, the next boot finds no file and starts the generation over at 1. A failed sync
\* that cuts back the segment it appended to, though its Remove of the one before landed (CutLanded,
\* before 0f300d62), and two process crashes reach it: without CutLanded these bounds reach no empty
\* first segment. ResumeAfterSeen must fail.
CONSTANTS
    MaxPub = 4
    SegFrames = 2
    MaxCrashes = 2
    MaxFails = 1
    Gaps = {"ProofRemoved", "CutLanded"}
    Bug = "none"
SPECIFICATION Spec
INVARIANTS NoRewrite ResumeAfterSeen
CHECK_DEADLOCK FALSE

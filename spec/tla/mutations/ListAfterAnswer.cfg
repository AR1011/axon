    HolderLease = 1
    RestartWait = 1
    MaxSkew = 0
    MaxTime = 4
    MaxPrepares = 1
    MaxCrashes = 2
    HolderFromReply = FALSE
    EpochTies = FALSE
    FloorAtCrash = FALSE
    Durable = TRUE
    AnswerBeforeDisk = TRUE
    LogFloor = TRUE
SPECIFICATION Spec
SYMMETRY Symmetry
VIEW View
INVARIANTS Listed
CHECK_DEADLOCK FALSE

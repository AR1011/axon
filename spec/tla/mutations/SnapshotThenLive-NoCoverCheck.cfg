\* A relay's replay after a snapshot takes what its ring still holds when the ring has evicted
\* records the replay needs (hub.rs accept_snapshot's covers and MemoryStore::read_after's range check
\* skipped): Contiguous must fail.
CONSTANTS
    Keys = {k1, k2}
    Vals = {v1}
    Absent = Absent
    MaxRecords = 4
    MaxCrashes = 2
    MaxResends = 1
    RingSize = 2
    ReplayOffset = 1
    SplitSnapshot = FALSE
    SnapAhead = FALSE
    ReadUnsynced = FALSE
    StaleResume = FALSE
    NoDedup = FALSE
    NoCoverCheck = TRUE
    StaleCut = FALSE
    TailFirst = FALSE
    StallRelay = FALSE
    EarlyRelease = FALSE
    RelaySubs = 1
    SnapToLive = FALSE
    KeepSubs = FALSE
    ReadPastCut = FALSE
    LabelAtRelease = FALSE
    StopAtReset = FALSE
SPECIFICATION Spec
SYMMETRY Symmetry
INVARIANTS Contiguous
CHECK_DEADLOCK FALSE

\* A write syncs only the last file it appended to (OsFiles::apply_now: sync_data on each appended
\* file), so a write that rolls leaves the older segment's frames unsynced. CursorDurable must fail.
CONSTANTS
    MaxPub = 4
    SegFrames = 2
    MaxCrashes = 2
    MaxFails = 1
    Gaps = {}
    Bug = "SyncOnlyLast"
SPECIFICATION Spec
INVARIANTS NoRewrite ResumeAfterSeen NextAfterDurable CursorDurable SeenDurable DurableKept RingContiguous
CHECK_DEADLOCK FALSE

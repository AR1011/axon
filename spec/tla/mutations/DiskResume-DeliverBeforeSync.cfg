\* A publish reaches the hub and the follower when it is admitted, not once disk_written says it is
\* synced (core.rs: the disk_written gate removed). CursorDurable must fail; ResumeAfterSeen too,
\* once a crash loses what the follower saw.
CONSTANTS
    MaxPub = 4
    SegFrames = 2
    MaxCrashes = 2
    MaxFails = 1
    Gaps = {}
    Bug = "DeliverBeforeSync"
SPECIFICATION Spec
INVARIANTS NoRewrite ResumeAfterSeen CursorDurable SeenDurable DurableKept RingContiguous
CHECK_DEADLOCK FALSE

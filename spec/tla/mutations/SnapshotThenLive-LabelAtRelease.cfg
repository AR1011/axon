\* hub.rs Sub::release_held labels the held state with the cursor at release, not the one it was
\* taken at, while records were committed between: StateMatches must fail.
CONSTANTS
    Keys = {k1, k2}
    Vals = {v1}
    Absent = Absent
    MaxRecords = 4
    MaxCrashes = 2
    MaxResends = 1
    RingSize = 2
    ReplayOffset = 1
    SplitSnapshot = FALSE
    SnapAhead = FALSE
    ReadUnsynced = FALSE
    StaleResume = FALSE
    NoDedup = FALSE
    NoCoverCheck = FALSE
    StaleCut = FALSE
    TailFirst = FALSE
    StallRelay = FALSE
    EarlyRelease = FALSE
    RelaySubs = 1
    SnapToLive = FALSE
    KeepSubs = FALSE
    ReadPastCut = FALSE
    LabelAtRelease = TRUE
    StopAtReset = FALSE
SPECIFICATION Spec
SYMMETRY Symmetry
INVARIANTS Contiguous StateMatches AtTip SeenIsDurable SeenIsKept
CHECK_DEADLOCK FALSE

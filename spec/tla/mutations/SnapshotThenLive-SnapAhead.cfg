\* A snapshot's state read after its position, say from disk.rs DiskStore's state at admission
\* instead of the hub's durable one: StateMatches must fail.
CONSTANTS
    Keys = {k1, k2}
    Vals = {v1}
    Absent = Absent
    MaxRecords = 4
    MaxCrashes = 2
    MaxResends = 1
    RingSize = 2
    ReplayOffset = 1
    SplitSnapshot = FALSE
    SnapAhead = TRUE
    ReadUnsynced = FALSE
    StaleResume = FALSE
    NoDedup = FALSE
    NoCoverCheck = FALSE
    StaleCut = FALSE
    TailFirst = FALSE
    StallRelay = FALSE
    EarlyRelease = FALSE
    RelaySubs = 1
    SnapToLive = FALSE
    KeepSubs = FALSE
    ReadPastCut = FALSE
    LabelAtRelease = FALSE
    StopAtReset = FALSE
SPECIFICATION Spec
SYMMETRY Symmetry
INVARIANTS StateMatches
CHECK_DEADLOCK FALSE

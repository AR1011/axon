\* A renewal holds the fence lease_grace from its reply (spawn.rs renew_loop `lease.fence.hold_for(self.lease_grace)`
\* in place of the time left to `until`), so after a slow answer the actor outlives the acceptors' lease.
\* HandoverWide.cfg's bounds: at Handover.cfg's one-tick margin it passes. OneUnfenced must fail.
CONSTANTS
    N = 2
    Grace = 3
    Hold = 4
    AccLease = 4
    MaxDelay = 2
    AcqDelay = 2
    MaxE = 3
    MaxCrashes = 0
    MaxLeaves = 0
    MaxAuthFaults = 0
    MaxStray = 1
    MaxLate = 0
    Punctual = FALSE
    Callers = TRUE
    Eager = FALSE
    OtherKeys = FALSE
    Open = {}
    MaxCuts = 0
    Bug = "FenceFromReply"
SPECIFICATION Spec
VIEW View
INVARIANTS OneUnfenced
CHECK_DEADLOCK FALSE

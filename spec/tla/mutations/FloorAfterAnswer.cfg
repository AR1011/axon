\* The log's floor, but the accept answered before it is logged: a crash between the two forgets the epoch, and with
\* clocks further apart than the restart wait EpochsGrow must fail. SkewLogFloor.cfg is the control.
CONSTANTS
    Acceptors = {a1, a2, a3}
    Proposers = {1, 2}
    AcceptorLease = 1
    HolderLease = 1
    RestartWait = 1
    MaxSkew = 2
    MaxTime = 1
    MaxPrepares = 1
    MaxCrashes = 1
    HolderFromReply = FALSE
    EpochTies = FALSE
    FloorAtCrash = FALSE
    Durable = TRUE
    AnswerBeforeDisk = TRUE
    LogFloor = TRUE
SPECIFICATION Spec
SYMMETRY Symmetry
VIEW View
INVARIANTS EpochsGrow
CHECK_DEADLOCK FALSE

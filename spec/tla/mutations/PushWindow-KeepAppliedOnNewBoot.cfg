\* A new parent boot's channel is followed from the old boot's applied: the new boot's first pushes are skipped, and acknowledged. ChannelExact or InOrder must fail (and Done does).
CONSTANTS
    Streams = {"s1", "s2"}
    MaxRec = 2
    Window = 2
    MaxInflight = 2
    MaxBranch = 2
    MaxBoots = 2
    MaxChan = 5
    MaxFaults = 2
    Mutation = "KeepAppliedOnNewBoot"
SPECIFICATION Spec
INVARIANTS ChannelExact InOrder
CHECK_DEADLOCK FALSE

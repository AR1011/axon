\* A boot resumes from the unsynced tail: Files::read returns the page cache without syncing it, as
\* before e5bd1cb ("a process crash could leave bytes in the page cache that were never synced, and
\* the restarted origin served them. A machine crash then lost them after a subscriber had seen
\* them"). CursorDurable must fail at the boot that serves them; ResumeAfterSeen after the machine
\* crash.
CONSTANTS
    MaxPub = 4
    SegFrames = 2
    MaxCrashes = 2
    MaxFails = 1
    Gaps = {}
    Bug = "UnsyncedTail"
SPECIFICATION Spec
INVARIANTS NoRewrite ResumeAfterSeen NextAfterDurable CursorDurable SeenDurable DurableKept RingContiguous
CHECK_DEADLOCK FALSE

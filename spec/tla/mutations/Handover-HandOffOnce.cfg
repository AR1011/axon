\* The hand-off before 71fe559: a leave handed its key to the owner in its view, once. If the leaving
\* node crashes after the release and comes back first, the owner it picked no longer owns the key and
\* refuses NotOwner; the lease was released, so no held_by lists it, and an eager key waits for a
\* caller while a node is up throughout. KeyServedAlone fails.
CONSTANTS
    N = 2
    Grace = 3
    Hold = 4
    AccLease = 4
    MaxDelay = 1
    AcqDelay = 0
    MaxE = 6
    MaxCrashes = 1
    MaxLeaves = 1
    MaxAuthFaults = 0
    MaxStray = 0
    MaxLate = 0
    Punctual = TRUE
    Callers = FALSE
    Eager = TRUE
    OtherKeys = FALSE
    Open = {"HandOffOnce"}
    MaxCuts = 0
    Bug = "none"
SPECIFICATION LiveSpec
INVARIANTS OneUnfenced
PROPERTY KeyServedAlone
CHECK_DEADLOCK FALSE

\* The scan stops at a frame repeating a position already read instead of skipping it (disk.rs,
\* scan: the batch.after skip), so a boot cuts there and removes every later segment. CursorDurable
\* must fail.
CONSTANTS
    MaxPub = 4
    SegFrames = 2
    MaxCrashes = 2
    MaxFails = 1
    Gaps = {}
    Bug = "NoDupSkip"
SPECIFICATION Spec
INVARIANTS NoRewrite ResumeAfterSeen NextAfterDurable CursorDurable SeenDurable DurableKept RingContiguous
CHECK_DEADLOCK FALSE

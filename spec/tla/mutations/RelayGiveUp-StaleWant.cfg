\* Past bug, before 5e7ae55: a relay without a position kept the earliest start any child asked (core.rs: want_from lowered wanted_from only) after that child moved on, First or After an older position; the origin refuses it and the relay resets the branch of a child whose own start the origin holds. NoStartSkipped must fail.
CONSTANTS
    Relays = {"r1"}
    K = 2
    MaxSeq = 3
    MaxGen = 2
    UT = 2
    ViewLag = 1
    MaxBackoff = 3
    MaxCuts = 2
    MaxCrashes = 1
    Mutation = "StaleWant"
    Gaps = {}
SPECIFICATION Spec
INVARIANTS TypeOK NoSilentGap NoNeedlessReset NewGenFromOne GenNeverBack NoStartSkipped GenAheadNeverRefused
PROPERTY Recovers
CHECK_DEADLOCK FALSE

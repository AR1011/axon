\* The store before aadb655: retention could remove a segment the same write appends to (disk.rs,
\* DiskStore::retain), and its Remove drops those appends (fn remove, 294e305). A write [Append seg2,
\* Remove seg1] fails; its retry, with seg3 begun since, lets seg2 go too and becomes [Remove seg1,
\* Append seg3, Remove seg2]. A process crash after its first op leaves no file, though seg1's
\* record was delivered, and the boot starts the generation over at 1: ResumeAfterSeen must fail.
\* disk/tests.rs retention_keeps_a_segment_the_write_appends_to.
CONSTANTS
    MaxPub = 4
    SegFrames = 2
    MaxCrashes = 2
    MaxFails = 2
    Gaps = {"RetainUnsynced"}
    Bug = "none"
SPECIFICATION Spec
INVARIANTS NoRewrite ResumeAfterSeen
CHECK_DEADLOCK FALSE

\* Retention's Removes go before the appends of the same write (disk.rs, take: retain run before
\* the append loop), so a crash between them leaves the stream without the segment that held its
\* positions. CursorDurable must fail: a machine crash before the appends are synced loses them.
CONSTANTS
    MaxPub = 4
    SegFrames = 2
    MaxCrashes = 2
    MaxFails = 1
    Gaps = {}
    Bug = "RemoveFirst"
SPECIFICATION Spec
INVARIANTS NoRewrite ResumeAfterSeen NextAfterDurable CursorDurable SeenDurable DurableKept RingContiguous
CHECK_DEADLOCK FALSE

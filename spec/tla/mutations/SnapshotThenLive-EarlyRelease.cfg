\* Sub::release_held without its Recovering filter: a branch queues the state ahead of its replay, a
\* relay behind it refuses the state and asks again forever. Safe, so only StateArrives must fail. A sibling
\* of the starvation 94baf34 fixed, which needs queue capacity and is out of reach here.
CONSTANTS
    Keys = {k1}
    Vals = {v1}
    Absent = Absent
    MaxRecords = 3
    MaxCrashes = 1
    MaxResends = 1
    RingSize = 2
    ReplayOffset = 1
    SplitSnapshot = FALSE
    SnapAhead = FALSE
    ReadUnsynced = FALSE
    StaleResume = FALSE
    NoDedup = FALSE
    NoCoverCheck = FALSE
    StaleCut = FALSE
    TailFirst = FALSE
    StallRelay = FALSE
    EarlyRelease = TRUE
    RelaySubs = 1
    SnapToLive = FALSE
    KeepSubs = FALSE
    ReadPastCut = FALSE
    LabelAtRelease = FALSE
    StopAtReset = FALSE
SPECIFICATION LiveSpec
PROPERTIES StateArrives
CHECK_DEADLOCK FALSE

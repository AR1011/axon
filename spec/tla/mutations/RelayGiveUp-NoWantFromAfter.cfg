\* open_branch does not lower the relay's wanted_from for an After start (want_from), so a relay without a position takes the key up live past the child's position. NoStartSkipped must fail.
CONSTANTS
    Relays = {"r1"}
    K = 2
    MaxSeq = 3
    MaxGen = 2
    UT = 2
    ViewLag = 1
    MaxBackoff = 3
    MaxCuts = 2
    MaxCrashes = 1
    Mutation = "NoWantFromAfter"
    Gaps = {}
SPECIFICATION Spec
INVARIANTS TypeOK NoSilentGap NoNeedlessReset NewGenFromOne GenNeverBack NoStartSkipped GenAheadNeverRefused
PROPERTY Recovers
CHECK_DEADLOCK FALSE

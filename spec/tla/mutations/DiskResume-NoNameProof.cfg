\* A boot scans the first segment from 0, not from the position its name proves (disk.rs,
\* DiskStore::open: last from segments.first()), so a history whose older segments retention removed
\* reads as empty and starts over. Checked with NoRewrite alone, which must fail: the follower is
\* served another value at a position it saw.
CONSTANTS
    MaxPub = 4
    SegFrames = 2
    MaxCrashes = 2
    MaxFails = 1
    Gaps = {}
    Bug = "NoNameProof"
SPECIFICATION Spec
INVARIANTS NoRewrite
CHECK_DEADLOCK FALSE

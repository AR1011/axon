\* Before 8049630: a position every candidate refuses is given up at once, not after upstream_timeout from the newest candidate's appearance (the `stranded` it also added keeps a waiting key from being orphaned, and matters only during the wait). NoNeedlessReset must fail.
CONSTANTS
    Relays = {"r1"}
    K = 2
    MaxSeq = 3
    MaxGen = 2
    UT = 2
    ViewLag = 1
    MaxBackoff = 3
    MaxCuts = 2
    MaxCrashes = 1
    Mutation = "GiveUpAtOnce"
    Gaps = {}
SPECIFICATION Spec
INVARIANTS TypeOK NoSilentGap NoNeedlessReset NewGenFromOne GenNeverBack NoStartSkipped GenAheadNeverRefused
PROPERTY Recovers
CHECK_DEADLOCK FALSE

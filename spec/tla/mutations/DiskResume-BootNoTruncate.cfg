\* A boot that cuts a torn tail does not truncate the file (disk.rs, DiskStore::open: the Truncate
\* dropped), so the next append lands after the torn frame and the boot after it cuts there.
\* CursorDurable must fail: the records after the torn frame are synced but no boot reads them.
CONSTANTS
    MaxPub = 4
    SegFrames = 2
    MaxCrashes = 2
    MaxFails = 1
    Gaps = {}
    Bug = "BootNoTruncate"
SPECIFICATION Spec
INVARIANTS NoRewrite ResumeAfterSeen NextAfterDurable CursorDurable SeenDurable DurableKept RingContiguous
CHECK_DEADLOCK FALSE

\* The scan takes a frame past a gap (disk.rs, scan: batch.first() > out.last + 1 dropped), so a
\* boot resumes after positions no file holds, and its ring has a hole. RingContiguous must fail.
CONSTANTS
    MaxPub = 4
    SegFrames = 2
    MaxCrashes = 2
    MaxFails = 1
    Gaps = {}
    Bug = "NoGapCheck"
SPECIFICATION Spec
INVARIANTS NoRewrite ResumeAfterSeen NextAfterDurable CursorDurable SeenDurable DurableKept RingContiguous
CHECK_DEADLOCK FALSE

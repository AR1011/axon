\* respawn before 71fe559: it released the lease before it asked the owner, so a leaving node that crashes
\* in between loses the request even if it would have followed the key to its owner, and the released key
\* of an eager kind waits for a caller: retrying the request does not close the gap. KeyServedAlone fails.
CONSTANTS
    N = 2
    Grace = 3
    Hold = 4
    AccLease = 4
    MaxDelay = 1
    AcqDelay = 0
    MaxE = 6
    MaxCrashes = 1
    MaxLeaves = 1
    MaxAuthFaults = 0
    MaxStray = 0
    MaxLate = 0
    Punctual = TRUE
    Callers = FALSE
    Eager = TRUE
    OtherKeys = FALSE
    Open = {"CrashLosesRequest"}
    MaxCuts = 0
    Bug = "none"
SPECIFICATION LiveSpec
INVARIANTS OneUnfenced
PROPERTY KeyServedAlone
CHECK_DEADLOCK FALSE

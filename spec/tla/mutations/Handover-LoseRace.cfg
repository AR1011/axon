\* A past bug, before 234840d: spawn_local checked `lost`, released that lock, then looked for the lease
\* entry; lose() on the renew task could take the due entry out in between and note it lost after. A start
\* answered from the still-live hold then built a fresh lease_grace fence on the epoch just lost, which
\* outlasts the acceptors' lease (spawn.rs Inner::hold and Inner::lose now take both locks together;
\* a_start_from_the_hold_never_fences_anew_an_epoch_lose_takes). OneUnfenced fails.
CONSTANTS
    N = 2
    Grace = 2
    Hold = 3
    AccLease = 3
    MaxDelay = 2
    AcqDelay = 2
    MaxE = 3
    MaxCrashes = 1
    MaxLeaves = 1
    MaxAuthFaults = 0
    MaxStray = 1
    MaxLate = 0
    Punctual = FALSE
    Callers = TRUE
    Eager = FALSE
    OtherKeys = FALSE
    Open = {"LoseRace"}
    MaxCuts = 0
    Bug = "none"
SPECIFICATION Spec
VIEW View
INVARIANTS OneUnfenced
CHECK_DEADLOCK FALSE

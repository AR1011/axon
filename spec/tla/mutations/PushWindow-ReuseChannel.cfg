\* A new Downstream takes the parent boot's last channel id again: an old channel's answers and pushes count on the new one. InOrder must fail.
CONSTANTS
    Streams = {"s1", "s2"}
    MaxRec = 2
    Window = 2
    MaxInflight = 2
    MaxBranch = 2
    MaxBoots = 2
    MaxChan = 5
    MaxFaults = 2
    Mutation = "ReuseChannel"
SPECIFICATION Spec
INVARIANTS InOrder
CHECK_DEADLOCK FALSE

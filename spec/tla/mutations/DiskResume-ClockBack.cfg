\* The store before 39577f5, under a wall clock that repeats a millisecond across restarts: a new
\* segment was named by its first position and the clock's millisecond alone (disk.rs, take), so one
\* begun after a restart could take the name of a segment the boot found torn at its first frame and
\* queued for removal. That Remove, taken again with a failed write whose retention removed the
\* segment before, deletes the new one, and the next boot finds no file and starts the generation over
\* at 1: ResumeAfterSeen must fail. disk/tests.rs
\* a_new_segment_never_takes_the_name_of_one_a_boot_removes.
CONSTANTS
    MaxPub = 4
    SegFrames = 2
    MaxCrashes = 2
    MaxFails = 1
    Gaps = {"ClockBack"}
    Bug = "none"
SPECIFICATION Spec
INVARIANTS NoRewrite ResumeAfterSeen
CHECK_DEADLOCK FALSE

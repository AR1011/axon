\* The wait runs from the oldest candidate's appearance, not the newest's, on the two-relay bounds (with one relay it cannot fail). NoNeedlessReset must fail.
CONSTANTS
    Relays = {"r1", "r2"}
    K = 1
    MaxSeq = 2
    MaxGen = 1
    UT = 2
    ViewLag = 1
    MaxBackoff = 1
    MaxCuts = 2
    MaxCrashes = 1
    Mutation = "OldestCandidate"
    Gaps = {}
SPECIFICATION Spec
INVARIANTS TypeOK NoSilentGap NoNeedlessReset NewGenFromOne GenNeverBack NoStartSkipped GenAheadNeverRefused
PROPERTY Recovers
CHECK_DEADLOCK FALSE

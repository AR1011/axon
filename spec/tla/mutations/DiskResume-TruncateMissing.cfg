\* A Truncate of a file that is gone fails the write, as OsFiles did before e5bd1cb ("A failed write
\* that was replayed whole no longer fails forever with NotFound"): a boot cuts a torn tail, the
\* first write also removes that segment by retention and fails, and every retry then stops at the
\* Truncate. WritesGoThrough must fail.
CONSTANTS
    MaxPub = 3
    SegFrames = 2
    MaxCrashes = 2
    MaxFails = 2
    Gaps = {}
    Bug = "TruncateMissing"
SPECIFICATION LiveSpec
PROPERTY WritesGoThrough
CHECK_DEADLOCK FALSE

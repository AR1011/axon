\* Past bug, before 7f297b0: a candidate that leaves the view and comes back between two turns of the node.rs loop keeps its available_since and its refusal, so the leaf gives up without waiting upstream_timeout for it (reconcile renews them only when the candidate list differs, and the loop passed no leaves to parents_left). NoNeedlessReset must fail.
CONSTANTS
    Relays = {"r1"}
    K = 2
    MaxSeq = 3
    MaxGen = 2
    UT = 2
    ViewLag = 1
    MaxBackoff = 3
    MaxCuts = 2
    MaxCrashes = 1
    Mutation = "Coalesced"
    Gaps = {}
SPECIFICATION Spec
INVARIANTS TypeOK NoSilentGap NoNeedlessReset NewGenFromOne GenNeverBack NoStartSkipped GenAheadNeverRefused
PROPERTY Recovers
CHECK_DEADLOCK FALSE

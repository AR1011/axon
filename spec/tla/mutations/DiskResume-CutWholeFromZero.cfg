\* A history cut whole starts its generation over at 1, as before e5bd1cb (a stream whose every
\* segment was cut was not found, so open_stream took it for a new one; the fix: "A history cut whole
\* resumes after the position its first segment's name proves"). ResumeAfterSeen must fail.
CONSTANTS
    MaxPub = 4
    SegFrames = 2
    MaxCrashes = 2
    MaxFails = 1
    Gaps = {}
    Bug = "CutWholeFromZero"
SPECIFICATION Spec
INVARIANTS NoRewrite ResumeAfterSeen NextAfterDurable CursorDurable SeenDurable DurableKept RingContiguous
CHECK_DEADLOCK FALSE

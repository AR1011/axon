\* The writer publishes a record before the other node holds it; a move then writes another at that
\* position. SameRecord must fail.
CONSTANTS
    MaxSeq = 3
    MaxMoves = 2
    MaxFaults = 2
    Mutation = "PublishBeforeCommit"
SPECIFICATION Spec
INVARIANTS TypeOK NoRepeat NoGap SameRecord NoEnd
PROPERTY CatchesUp
CHECK_DEADLOCK FALSE

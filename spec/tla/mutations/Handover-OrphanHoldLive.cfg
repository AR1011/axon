\* A past bug, before 6e8a979: the orphan hold of Handover-OrphanHold.cfg on a node that is not the
\* owner was renewed with that node's other keys (Proposer::renew renews every key held), so the owner was
\* refused Held for good. KeyServed fails (OneUnfenced is left out: the same gap fails it first).
CONSTANTS
    N = 2
    Grace = 3
    Hold = 4
    AccLease = 4
    MaxDelay = 1
    AcqDelay = 0
    MaxE = 8
    MaxCrashes = 1
    MaxLeaves = 1
    MaxAuthFaults = 1
    MaxStray = 1
    MaxLate = 1
    Punctual = TRUE
    Callers = TRUE
    Eager = FALSE
    OtherKeys = TRUE
    Open = {"OrphanHold"}
    MaxCuts = 0
    Bug = "none"
SPECIFICATION LiveSpec
PROPERTY KeyServed
CHECK_DEADLOCK FALSE

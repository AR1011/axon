\* Clocks skewed by more than the restart wait, without the log's floor: EpochsGrow must fail (SkewLogFloor.cfg,
\* with it, passes). One prepare each, so
\* an epoch runs ahead of its clock only by the skew, not by the retries that add a tick each here.
CONSTANTS
    Acceptors = {a1, a2, a3}
    Proposers = {1, 2}
    AcceptorLease = 1
    HolderLease = 1
    RestartWait = 1
    MaxSkew = 2
    MaxTime = 1
    MaxPrepares = 1
    MaxCrashes = 1
    HolderFromReply = FALSE
    EpochTies = FALSE
    FloorAtCrash = FALSE
    Durable = TRUE
    AnswerBeforeDisk = FALSE
    LogFloor = FALSE
SPECIFICATION Spec
SYMMETRY Symmetry
VIEW View
INVARIANTS EpochsGrow
CHECK_DEADLOCK FALSE

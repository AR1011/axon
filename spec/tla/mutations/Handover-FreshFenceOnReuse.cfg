\* A start answered from the hold builds a new lease entry even when one of that epoch is open (spawn.rs
\* spawn_local's `.filter(|held| held.epoch == epoch)` reuse dropped; f9c1546: "A key taken again before
\* it was released keeps the deadline it had"), so the new actor's fence runs past the acceptors' lease.
\* OneUnfenced must fail.
CONSTANTS
    N = 2
    Grace = 2
    Hold = 3
    AccLease = 3
    MaxDelay = 2
    AcqDelay = 2
    MaxE = 3
    MaxCrashes = 1
    MaxLeaves = 1
    MaxAuthFaults = 0
    MaxStray = 1
    MaxLate = 0
    Punctual = FALSE
    Callers = TRUE
    Eager = FALSE
    OtherKeys = FALSE
    Open = {}
    MaxCuts = 0
    Bug = "FreshFenceOnReuse"
SPECIFICATION Spec
VIEW View
INVARIANTS OneUnfenced
CHECK_DEADLOCK FALSE

\* A boot refills the ring without the position before the last (an off-by-one in disk.rs,
\* DiskRead::read, or core.rs, open_origin at first - 1). The follower behind the cursor stalls
\* there and no other invariant notices. RingContiguous must fail.
CONSTANTS
    MaxPub = 4
    SegFrames = 2
    MaxCrashes = 2
    MaxFails = 1
    Gaps = {}
    Bug = "RingGap"
SPECIFICATION Spec
INVARIANTS NoRewrite ResumeAfterSeen NextAfterDurable CursorDurable SeenDurable DurableKept RingContiguous
CHECK_DEADLOCK FALSE

\* A restart rebuilds the state at an earlier position than it resumes after, as disk.rs DiskRead::read
\* skipping the newest segment's batches after its STATE frame would, and hub.rs resume_stream installs
\* it: StateMatches must fail.
CONSTANTS
    Keys = {k1, k2}
    Vals = {v1}
    Absent = Absent
    MaxRecords = 4
    MaxCrashes = 2
    MaxResends = 1
    RingSize = 2
    ReplayOffset = 1
    SplitSnapshot = FALSE
    SnapAhead = FALSE
    ReadUnsynced = FALSE
    StaleResume = TRUE
    NoDedup = FALSE
    NoCoverCheck = FALSE
    StaleCut = FALSE
    TailFirst = FALSE
    StallRelay = FALSE
    EarlyRelease = FALSE
    RelaySubs = 1
    SnapToLive = FALSE
    KeepSubs = FALSE
    ReadPastCut = FALSE
    LabelAtRelease = FALSE
    StopAtReset = FALSE
SPECIFICATION Spec
SYMMETRY Symmetry
INVARIANTS StateMatches
CHECK_DEADLOCK FALSE

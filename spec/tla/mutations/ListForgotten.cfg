    HolderFromReply = FALSE
    EpochTies = FALSE
    FloorAtCrash = FALSE
    Durable = FALSE
    AnswerBeforeDisk = FALSE
    LogFloor = TRUE
SPECIFICATION Spec
SYMMETRY Symmetry
VIEW View
INVARIANTS Listed

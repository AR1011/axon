\* The acquire-side twin of 3156261: a new lease entry counted from the acquire's answer instead of from
\* `asked` (spawn.rs spawn_local, until = asked + lease_grace), so a slow grant let the actor outlive the
\* acceptors' lease. OneUnfenced must fail.
CONSTANTS
    N = 2
    Grace = 2
    Hold = 3
    AccLease = 3
    MaxDelay = 2
    AcqDelay = 2
    MaxE = 3
    MaxCrashes = 1
    MaxLeaves = 1
    MaxAuthFaults = 0
    MaxStray = 1
    MaxLate = 0
    Punctual = FALSE
    Callers = TRUE
    Eager = FALSE
    OtherKeys = FALSE
    Open = {}
    MaxCuts = 0
    Bug = "AcquireFromAnswer"
SPECIFICATION Spec
VIEW View
INVARIANTS OneUnfenced
CHECK_DEADLOCK FALSE

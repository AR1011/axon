    Relays = {"r1"}
    K = 2
    MaxSeq = 3
    MaxGen = 2
    UT = 2
    ViewLag = 1
    MaxBackoff = 3
    MaxCuts = 2
    MaxCrashes = 1
    Mutation = "StaleSince"
    Gaps = {}
SPECIFICATION Spec
INVARIANTS TypeOK NoSilentGap NoNeedlessReset NewGenFromOne GenNeverBack NoStartSkipped GenAheadNeverRefused
PROPERTY Recovers
CHECK_DEADLOCK FALSE

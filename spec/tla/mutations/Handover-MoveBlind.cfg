\* A key started past its owner moves to the owner without asking whether it would take it: moved to an
\* owner that reaches no majority of the acceptors, it stops there and starts past it again at the next
\* call, over and over (world_reach.rs reach_back). KeyServedReachable must fail.
CONSTANTS
    N = 2
    Grace = 3
    Hold = 4
    AccLease = 4
    MaxDelay = 1
    AcqDelay = 0
    MaxE = 8
    MaxCrashes = 0
    MaxLeaves = 0
    MaxAuthFaults = 0
    MaxStray = 0
    MaxLate = 0
    Punctual = TRUE
    Callers = TRUE
    Eager = FALSE
    OtherKeys = FALSE
    Open = {}
    MaxCuts = 2
    Bug = "MoveBlind"
SPECIFICATION LiveSpec
INVARIANTS OneUnfenced MoveInOrder
PROPERTY KeyServedReachable
CHECK_DEADLOCK FALSE

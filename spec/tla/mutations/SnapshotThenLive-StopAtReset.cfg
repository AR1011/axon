\* hub.rs accept_snapshot returns after resetting a subscriber the ring cannot replay to, instead
\* of going on to the next: a later subscriber waits while the feed no longer asks for the state.
\* Two relay subscribers; only StateArrives must fail.
CONSTANTS
    Keys = {k1}
    Vals = {v1}
    Absent = Absent
    MaxRecords = 3
    MaxCrashes = 1
    MaxResends = 1
    RingSize = 2
    ReplayOffset = 1
    SplitSnapshot = FALSE
    SnapAhead = FALSE
    ReadUnsynced = FALSE
    StaleResume = FALSE
    NoDedup = FALSE
    NoCoverCheck = FALSE
    StaleCut = FALSE
    TailFirst = FALSE
    StallRelay = FALSE
    EarlyRelease = FALSE
    RelaySubs = 2
    SnapToLive = FALSE
    KeepSubs = FALSE
    ReadPastCut = FALSE
    LabelAtRelease = FALSE
    StopAtReset = TRUE
SPECIFICATION LiveSpec
PROPERTIES StateArrives
CHECK_DEADLOCK FALSE

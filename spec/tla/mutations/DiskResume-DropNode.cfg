\* Past bug, before 7769068: a StreamNode dropped in the process left its write running (node.rs
\* spawns files.apply in its own task, Inner::stop aborts only the writer loop), and a node started on
\* the same directory could boot before it landed. The old write's file and the new node's then share
\* a first position, the older sorts first at the next boot (on a clock that never steps back), and a
\* position the follower saw comes back with the old value: NoRewrite must fail. Its retention could
\* also remove a segment the new node resumes from (ResumeAfterSeen). A process crash stops every
\* task and does not reach it. node/tests.rs
\* a_directory_another_node_keeps_is_refused_until_its_last_write_lands.
CONSTANTS
    MaxPub = 4
    SegFrames = 2
    MaxCrashes = 2
    MaxFails = 1
    Gaps = {"DropNode"}
    Bug = "none"
SPECIFICATION Spec
INVARIANTS NoRewrite ResumeAfterSeen
CHECK_DEADLOCK FALSE

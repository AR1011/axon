\* Windowed pushes as designed, two streams: several pushes of one stream in flight (MaxRec = MaxBranch:
\* no slow-consumer reset; PushWindowOneStream.cfg has those). Must pass;
\* every mutations/PushWindow-*.cfg must fail.
CONSTANTS
    Streams = {"s1", "s2"}
    MaxRec = 2
    Window = 2
    MaxInflight = 2
    MaxBranch = 2
    MaxBoots = 2
    MaxChan = 5
    MaxFaults = 2
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS TypeOK InOrder ChannelExact AckSound FewChannels WindowBound CountExact BranchBound StreamInflight
PROPERTY Done
CHECK_DEADLOCK FALSE

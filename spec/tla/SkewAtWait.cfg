\* The control for mutations/SkewBeyondWait.cfg: the same bounds with clocks as far apart as the
\* restart wait, which must pass.
CONSTANTS
    Acceptors = {a1, a2, a3}
    Proposers = {1, 2}
    AcceptorLease = 1
    HolderLease = 1
    RestartWait = 1
    MaxSkew = 1
    MaxTime = 1
    MaxPrepares = 1
    MaxCrashes = 1
    HolderFromReply = FALSE
    EpochTies = FALSE
    FloorAtCrash = FALSE
    Durable = TRUE
    AnswerBeforeDisk = FALSE
    LogFloor = TRUE
SPECIFICATION Spec
SYMMETRY Symmetry
VIEW View
INVARIANTS MutualExclusion EpochsGrow
CHECK_DEADLOCK FALSE

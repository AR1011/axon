\* Windowed pushes as designed, one stream, one boot of each node and three faults: a Fail, an Expire
\* and a Forget let the child go back on what it answered, where the drop for an answer below acked
\* (§2.3) is needed. Must pass, as PushWindow.cfg does; mutations/PushWindow-IgnoreWentBack.cfg fails.
CONSTANTS
    Streams = {"s1"}
    MaxRec = 3
    Window = 2
    MaxInflight = 2
    MaxBranch = 3
    MaxBoots = 1
    MaxChan = 4
    MaxFaults = 3
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS TypeOK InOrder ChannelExact AckSound FewChannels WindowBound CountExact BranchBound StreamInflight
PROPERTY Done
CHECK_DEADLOCK FALSE

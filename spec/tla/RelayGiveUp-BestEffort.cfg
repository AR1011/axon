\* By design, fails: after a parent refuses record 1 of a new generation, the leaf asks for the live edge, though the origin's ring behind that relay holds record 1 (refuse, e7ca994). The guide promises record 1 only while the parent's ring holds it; NewGenFromOne checks the whole path, and fails.
CONSTANTS
    Relays = {"r1"}
    K = 2
    MaxSeq = 3
    MaxGen = 2
    UT = 2
    ViewLag = 1
    MaxBackoff = 3
    MaxCuts = 2
    MaxCrashes = 1
    Mutation = "none"
    Gaps = {"BestEffort"}
SPECIFICATION Spec
INVARIANTS TypeOK NoSilentGap NoNeedlessReset NewGenFromOne GenNeverBack NoStartSkipped GenAheadNeverRefused
PROPERTY Recovers
CHECK_DEADLOCK FALSE

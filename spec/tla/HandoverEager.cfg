\* Liveness without callers: an eager kind's key runs again after its node crashed (eager_loop on the
\* survivor, then a move back once the node returns), and a leave hands it over. Renewals and releases do
\* not fail here: a key whose lease is lost on a node that stays up waits for a caller, as the guide says
\* ("restarts only the keys of a node that is gone"), so a lost renewal would fail KeyServedAlone by design.
\* Acquires and other keys as in HandoverLive.cfg.
CONSTANTS
    N = 2
    Grace = 3
    Hold = 4
    AccLease = 4
    MaxDelay = 1
    AcqDelay = 0
    MaxE = 6
    MaxCrashes = 1
    MaxLeaves = 1
    MaxAuthFaults = 0
    MaxStray = 0
    MaxLate = 0
    Punctual = TRUE
    Callers = FALSE
    Eager = TRUE
    OtherKeys = FALSE
    Open = {}
    MaxCuts = 0
    Bug = "none"
SPECIFICATION LiveSpec
INVARIANTS OneUnfenced
PROPERTY KeyServedAlone
CHECK_DEADLOCK FALSE

\* StateArrives under fairness. Liveness is checked without symmetry, so the bounds are
\* smaller: 1 key, 1 value and removal, 3 records, a relay ring of 2, 1 crash, 1 resend.
CONSTANTS
    Keys = {k1}
    Vals = {v1}
    Absent = Absent
    MaxRecords = 3
    MaxCrashes = 1
    MaxResends = 1
    RingSize = 2
    ReplayOffset = 1
    SplitSnapshot = FALSE
    SnapAhead = FALSE
    ReadUnsynced = FALSE
    StaleResume = FALSE
    NoDedup = FALSE
    NoCoverCheck = FALSE
    StaleCut = FALSE
    TailFirst = FALSE
    StallRelay = FALSE
    EarlyRelease = FALSE
    RelaySubs = 2
    SnapToLive = FALSE
    KeepSubs = FALSE
    ReadPastCut = FALSE
    LabelAtRelease = FALSE
    StopAtReset = FALSE
SPECIFICATION LiveSpec
PROPERTIES StateArrives
CHECK_DEADLOCK FALSE

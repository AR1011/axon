\* The lease log: two acceptors restart, a majority, or one of them twice, and what a node was granted
\* and did not release is still listed by every warm majority. mutations/List*.cfg must fail. One prepare
\* per proposer, as in SkewAtWait.cfg.
CONSTANTS
    Acceptors = {a1, a2, a3}
    Proposers = {1, 2}
    AcceptorLease = 1
    HolderLease = 1
    RestartWait = 1
    MaxSkew = 0
    MaxTime = 4
    MaxPrepares = 1
    MaxCrashes = 2
    HolderFromReply = FALSE
    EpochTies = FALSE
    FloorAtCrash = FALSE
    Durable = TRUE
    AnswerBeforeDisk = FALSE
    LogFloor = TRUE
SPECIFICATION Spec
SYMMETRY Symmetry
VIEW View
INVARIANTS MutualExclusion EpochsGrow Listed
CHECK_DEADLOCK FALSE

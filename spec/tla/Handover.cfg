\* Safety of the hand-over, time free: 2 nodes, a crash, a leave, a start on a stale view, 3 grants,
\* acquires answered up to 2 ticks after the grant, the code's gaps closed (Open = {}). Other keys'
\* renewals are left out (OtherKeys = FALSE): with the gaps closed the only hold they could carry is one
\* this node lost, which it refuses to start from, so they only keep others out longer. Every
\* mutations/Handover-*.cfg must fail. No authority faults: with time free a refused renewal is one never
\* sent, and a lost release only keeps the other node out longer (HandoverLive.cfg has them, checking only
\* OneUnfenced). With one, an earlier version of this model had not finished after 10 min with -workers 4
\* (22.9 M distinct states, depth 31); with N = 3 neither (22.4 M distinct, depth 23, the queue growing). The margins between
\* Grace, Hold and AccLease stand for clock drift, which PaxosLeases' Skew.cfg checks, not this model.
\* A timing error of one tick is below this config's resolution: HandoverWide.cfg has a longer grace.
CONSTANTS
    N = 2
    Grace = 2
    Hold = 3
    AccLease = 3
    MaxDelay = 2
    AcqDelay = 2
    MaxE = 3
    MaxCrashes = 1
    MaxLeaves = 1
    MaxAuthFaults = 0
    MaxStray = 1
    MaxLate = 0
    Punctual = FALSE
    Callers = TRUE
    Eager = FALSE
    OtherKeys = FALSE
    Open = {}
    MaxCuts = 0
    Bug = "none"
SPECIFICATION Spec
VIEW View
INVARIANTS OneUnfenced MoveInOrder WritesInOrder WatchInOrder WatchShowsLive
CHECK_DEADLOCK FALSE

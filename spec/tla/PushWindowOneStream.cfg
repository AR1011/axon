\* Windowed pushes as designed, one stream: it fills the window, and a child that falls behind is
\* reset with pushes in flight. Must pass, as PushWindow.cfg does.
CONSTANTS
    Streams = {"s1"}
    MaxRec = 5
    Window = 3
    MaxInflight = 2
    MaxBranch = 4
    MaxBoots = 2
    MaxChan = 5
    MaxFaults = 2
    Mutation = "none"
SPECIFICATION Spec
INVARIANTS TypeOK InOrder ChannelExact AckSound FewChannels WindowBound CountExact BranchBound StreamInflight
PROPERTY Done
CHECK_DEADLOCK FALSE

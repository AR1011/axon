\* Liveness with callers: time waits for due renewals except once (a pause), and after a crash, a leave,
\* one authority fault (a refused renewal or a lost release) and a start on a stale view the key's owner
\* runs it for good. Must pass; mutations/Handover-StartIgnoresMove.cfg and Handover-OrphanHoldLive.cfg
\* must fail. Acquires are answered at the grant (AcqDelay = 0) and other keys' renewals left out
\* (OtherKeys = FALSE): with the gaps closed, both only shorten or lengthen a lease, and the pause and
\* the fault already do that.
CONSTANTS
    N = 2
    Grace = 3
    Hold = 4
    AccLease = 4
    MaxDelay = 1
    AcqDelay = 0
    MaxE = 8
    MaxCrashes = 1
    MaxLeaves = 1
    MaxAuthFaults = 1
    MaxStray = 1
    MaxLate = 1
    Punctual = TRUE
    Callers = TRUE
    Eager = FALSE
    OtherKeys = FALSE
    Open = {}
    MaxCuts = 0
    Bug = "none"
SPECIFICATION LiveSpec
INVARIANTS OneUnfenced
PROPERTY KeyServed
CHECK_DEADLOCK FALSE

\* The protocol as built. Every mutations/SnapshotThenLive-*.cfg must fail.
\* Bounds: 2 keys, 1 value and removal, 4 records, a relay ring of 2, 2 origin crashes (process or
\* machine), 1 resend, 1 relay subscriber. A second value, so a key is overwritten and not only
\* removed, is left out to stay inside ten minutes on a shared box.
CONSTANTS
    Keys = {k1, k2}
    Vals = {v1}
    Absent = Absent
    MaxRecords = 4
    MaxCrashes = 2
    MaxResends = 1
    RingSize = 2
    ReplayOffset = 1
    SplitSnapshot = FALSE
    SnapAhead = FALSE
    ReadUnsynced = FALSE
    StaleResume = FALSE
    NoDedup = FALSE
    NoCoverCheck = FALSE
    StaleCut = FALSE
    TailFirst = FALSE
    StallRelay = FALSE
    EarlyRelease = FALSE
    RelaySubs = 1
    SnapToLive = FALSE
    KeepSubs = FALSE
    ReadPastCut = FALSE
    LabelAtRelease = FALSE
    StopAtReset = FALSE
SPECIFICATION Spec
SYMMETRY Symmetry
INVARIANTS Contiguous StateMatches AtTip SeenIsDurable SeenIsKept
CHECK_DEADLOCK FALSE

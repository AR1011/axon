\* The protocol as built, with up to three copies lost or late, several in one report: a node cut
\* from two replicas, or with one fresh grant, which only the majority rule then bounds. No takes:
\* each node starts with an entry it took and gave back (Taken), and WithinLimit counts what it
\* could still take.
CONSTANTS
    N = 2
    Replicas = {r1, r2, r3}
    M = 2
    Costs = {1}
    Hold = 1
    Lease = 1
    MaxTime = 1
    MaxTakes = 0
    MaxReports = 2
    MaxRestarts = 0
    MaxDups = 0
    MaxPushes = 1
    MaxFaults = 3
    MaxLeft = 0
    Late = "any"
    Taken = TRUE
    PulledRaise = TRUE
    Bug = "none"
SPECIFICATION Spec
SYMMETRY Symmetry
VIEW View
INVARIANTS WithinLimit FallbackBound MaxMinFair
CHECK_DEADLOCK FALSE

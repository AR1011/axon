\* A file system that may lose a file's creation while keeping a later removal, both unsynced
\* (OsFiles syncs the directory once, after the whole write), to show what the store assumes of the
\* file system. A write rolls to a new segment and retention removes the old one; a machine crash
\* keeps the removal and loses the creation, and the boot finds no file: ResumeAfterSeen fails.
\* Ordering the creation before the removal would not close it: OsFiles syncs the directory only
\* when this write creates or removes a file (entries_changed), so a segment a failed write created,
\* which OsFiles leaves cut to empty, gets no directory sync when the retry appends to it, and the
\* retry's records are delivered all the same.
CONSTANTS
    MaxPub = 4
    SegFrames = 2
    MaxCrashes = 2
    MaxFails = 1
    Gaps = {"MetaReorder"}
    Bug = "none"
SPECIFICATION Spec
INVARIANTS NoRewrite ResumeAfterSeen NextAfterDurable
CHECK_DEADLOCK FALSE

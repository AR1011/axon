\* Liveness under cuts that are not a clean split: two reachability changes, each to any values of
\* which nodes the callers reach, which nodes reach a majority of the acceptors and whether the nodes
\* reach each other. The callers are answered for good once they reach every node that can take the
\* lease and one can (KeyServedReachable). Must pass; mutations/Handover-MoveBlind.cfg and
\* Handover-NoRedirect.cfg must fail. No crash, leave, authority fault, stray start or late tick:
\* HandoverLive.cfg checks those, and here the cuts alone decide where the key runs.
CONSTANTS
    N = 2
    Grace = 3
    Hold = 4
    AccLease = 4
    MaxDelay = 1
    AcqDelay = 0
    MaxE = 8
    MaxCrashes = 0
    MaxLeaves = 0
    MaxAuthFaults = 0
    MaxStray = 0
    MaxLate = 0
    Punctual = TRUE
    Callers = TRUE
    Eager = FALSE
    OtherKeys = FALSE
    Open = {}
    MaxCuts = 2
    Bug = "none"
SPECIFICATION LiveSpec
INVARIANTS OneUnfenced MoveInOrder
PROPERTY KeyServedReachable
CHECK_DEADLOCK FALSE

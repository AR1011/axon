[workspace]
resolver = "3"
members = [
    "crates/axon",
    "crates/axon-net",
    "crates/axon-cluster",
    "crates/axon-obs",
    "crates/axon-stream",
    "crates/axon-testkit",
    "fuzz",
    "examples/rig",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/AR1011/axon"
readme = "crates/axon/README.md"

# A dev-dependency on axon-testkit, or testkit's on axon-cluster, stays a bare path: crates.io strips those, and with a
# version the two could not be published one before the other.
[workspace.dependencies]
# The name axon is taken on crates.io; the package is axon-actors and its library is still axon.
axon = { package = "axon-actors", path = "crates/axon", version = "0.1.1", default-features = false }
axon-cluster = { path = "crates/axon-cluster", version = "0.1.1" }
axon-net = { path = "crates/axon-net", version = "0.1.1" }
axon-obs = { path = "crates/axon-obs", version = "0.1.1" }
axon-stream = { path = "crates/axon-stream", version = "0.1.1" }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(axon_loom)", "cfg(tokio_unstable)"] }

[workspace.lints.clippy]
disallowed_methods = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

# scripts/check.sh sim: release code without release's link-time work, which took most of a minute after each edit.
[profile.sim]
inherits = "release"
lto = false
codegen-units = 16

# Dependencies optimised in tests: unoptimised, tokio, rustls and argon2 made world_quota.rs take 407 s instead of
# 108 s. The workspace's own crates keep the test profile's opt-level and every debug assertion.
[profile.test.package."*"]
opt-level = 2

# The simulations in axon-cluster's tests (the quota sim runs 50 nodes for a minute of virtual time) take minutes a seed
# unoptimised; optimised, its whole suite runs faster than it did without the quota sim.
[profile.test.package.axon-cluster]
opt-level = 2
